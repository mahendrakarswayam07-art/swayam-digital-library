<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Book Reader</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;background:#141414;border-bottom:1px solid #333}
header h2{font-size:18px;margin:0}
.btn{display:inline-block;padding:10px 14px;border-radius:8px;background:#e52c35;color:#fff;text-decoration:none;border:0;cursor:pointer;font-size:14px;font-weight:bold}
.btn.dark{background:#2a2a2a;border:1px solid #444}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
main{text-align:center;padding:18px 10px 30px}
main h1{font-size:22px;margin:0 0 6px}
.hint{color:#999;font-size:13px;margin:0 0 6px}
#status{color:#ff777d;min-height:22px;font-size:14px;margin:6px 0}
#book{margin:14px auto;max-width:100%;display:flex;justify-content:center}
.page{background:#fff;overflow:hidden;box-shadow:0 4px 18px #0008;position:relative}
.page img{position:absolute;inset:0;width:100%;height:100%;display:block;background:#fff;user-select:none;-webkit-user-drag:none}
.page img:not([src]){visibility:hidden}
.page .ph{position:absolute;inset:0;display:grid;place-items:center;color:#bbb;font-size:13px;background:#f4f4f4}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
#pageInfo{font-weight:bold;min-width:130px}
.jump{display:flex;gap:6px;align-items:center}
.jump input{width:70px;padding:9px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:14px}
@media(max-width:600px){header h2{font-size:15px}main{padding:12px 4px}}
</style>
</head>
<body>
<header>
    <h2>📚 Swayam Kumar · Digital Library</h2>
    <div class="head-actions">
        <a class="btn dark" id="openOriginal" href="#" target="_blank" rel="noopener">Open PDF ↗</a>
        <a class="btn" id="backLink" href="dashboard.html#modules">← Back</a>
    </div>
</header>
<main>
    <h1 id="bookTitle">Study Material</h1>
    <p class="hint">Click or drag the page corners, use the buttons, or press the ← → keys.</p>
    <div id="status">Loading flip book...</div>
    <div id="book"></div>
    <div class="controls">
        <button class="btn" id="prev">← Previous</button>
        <span id="pageInfo">Page - / -</span>
        <button class="btn" id="next">Next →</button>
        <div class="jump"><input type="number" id="jumpInput" min="1" placeholder="Page"><button class="btn dark" id="jumpBtn">Go</button></div>
    </div>
</main>

<script src="pages/manifest.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
var params = new URLSearchParams(location.search);
var bookId = params.get("book");
var file = params.get("file");
var title = params.get("title") || "Study Material";
var back = params.get("back");
document.getElementById("bookTitle").textContent = title;
if (back) document.getElementById("backLink").href = back;
if (file) document.getElementById("openOriginal").href = file;
else document.getElementById("openOriginal").style.display = "none";

var statusEl = document.getElementById("status");
var book = null, total = 0, info = null;
var pageEls = [], imgs = [];
var AHEAD = 6;    // pages loaded around the current page
var KEEP = 16;    // pages further away than this are unloaded

function setStatus(t) { statusEl.textContent = t; }
function pageUrl(n) { return info.dir + ("00" + n).slice(-3) + ".jpg"; }

function loadAround(index) {
  var center = index + 1;
  for (var n = 1; n <= total; n++) {
    var img = imgs[n - 1];
    var d = Math.abs(n - center);
    if (d <= AHEAD) {
      if (!img.getAttribute("src")) img.src = pageUrl(n);
    } else if (d > KEEP && img.getAttribute("src")) {
      img.removeAttribute("src");
    }
  }
}

function updatePage() {
  if (!book) return;
  var idx = book.getCurrentPageIndex();
  document.getElementById("pageInfo").textContent = "Page " + (idx + 1) + " / " + book.getPageCount();
  loadAround(idx);
}

function start() {
  if (!bookId || !window.FLIPBOOKS || !FLIPBOOKS[bookId]) {
    setStatus("Choose a module from the dashboard first.");
    return;
  }
  if (!window.St) {
    setStatus("The flip book library could not load. Check your internet connection and refresh.");
    return;
  }
  info = FLIPBOOKS[bookId];
  total = info.pages;

  var W = 420, H = Math.round(W * info.ratio);
  var holder = document.getElementById("book");
  for (var n = 1; n <= total; n++) {
    var el = document.createElement("div");
    el.className = "page";
    var ph = document.createElement("div");
    ph.className = "ph"; ph.textContent = "Page " + n;
    var img = document.createElement("img");
    img.alt = "Page " + n;
    img.draggable = false;
    el.appendChild(ph);
    el.appendChild(img);
    holder.appendChild(el);
    pageEls.push(el);
    imgs.push(img);
  }

  book = new St.PageFlip(holder, {
    width: W, height: H, size: "stretch",
    minWidth: 260, maxWidth: 700,
    minHeight: Math.round(260 * info.ratio), maxHeight: Math.round(700 * info.ratio),
    showCover: true, maxShadowOpacity: 0.4, usePortrait: true, mobileScrollSupport: false
  });
  book.loadFromHTML(pageEls);
  book.on("flip", updatePage);

  setStatus(total + " pages · flip book ready");
  updatePage();
}

document.getElementById("prev").onclick = function () { if (book) book.flipPrev(); };
document.getElementById("next").onclick = function () { if (book) book.flipNext(); };
document.getElementById("jumpBtn").onclick = function () {
  var v = parseInt(document.getElementById("jumpInput").value, 10);
  if (book && v >= 1 && v <= total) { book.turnToPage(v - 1); updatePage(); }
};
document.getElementById("jumpInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") document.getElementById("jumpBtn").click();
});
document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") document.getElementById("next").click();
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
});
start();
</script>
</body>
</html>
